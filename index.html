
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStream - Form Validation & Live API (Prac 11)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f3ff;
            color: #312e81;
            padding: 30px;
            margin: 0;
        }

        .form-card {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #a78bfa;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #6d28d9;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #5b21b6;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
            font-weight: bold;
        }

        .success {
            color: #166534;
            background-color: #dcfce7;
            border-left: 5px solid #16a34a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 18px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="form-card">

        <h2>💻 DevStream Developer Registration</h2>

        <form onsubmit="return false;">

            <label for="visitorName">Developer Name:</label>
            <input type="text" id="visitorName" placeholder="Enter your full name">
            <div id="nameError" class="error"></div>

            <label for="countryCode">Country Code:</label>
            <input type="text" id="countryCode" placeholder="Enter 2-letter code (IN)">
            <div id="countryError" class="error"></div>

            <label for="travellers">Number of Projects:</label>
            <input type="text" id="travellers" placeholder="Enter number of projects">
            <div id="travellerError" class="error"></div>

            <button type="button" onclick="validateAndFetchCountry()">
                Verify Country & Register
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script>
        async function validateAndFetchCountry() {

            const name = document.getElementById("visitorName").value.trim();
            const code = document.getElementById("countryCode").value.trim();
            const travellers = document.getElementById("travellers").value.trim();

            const nameError = document.getElementById("nameError");
            const countryError = document.getElementById("countryError");
            const travellerError = document.getElementById("travellerError");
            const result = document.getElementById("result");

            nameError.innerText = "";
            countryError.innerText = "";
            travellerError.innerText = "";
            result.innerHTML = "";

            let valid = true;

            const lettersOnly = /^[A-Za-z ]+$/;
            const countryPattern = /^[A-Za-z]{2}$/;
            const numberPattern = /^[0-9]+$/;

            if (name === "") {
                nameError.innerText = "Please enter your name.";
                valid = false;
            } else if (!lettersOnly.test(name)) {
                nameError.innerText = "Name must contain letters only.";
                valid = false;
            }

            if (code === "") {
                countryError.innerText = "Country code cannot be empty.";
                valid = false;
            } else if (!countryPattern.test(code)) {
                countryError.innerText = "Enter a valid 2-letter country code.";
                valid = false;
            }

            if (travellers === "") {
                travellerError.innerText = "Please enter number of projects.";
                valid = false;
            } else if (!numberPattern.test(travellers) || Number(travellers) <= 0) {
                travellerError.innerText = "Enter a valid positive number.";
                valid = false;
            }

            if (!valid) return;

            result.innerHTML = "<p>Verifying country details using live API...</p>";

            try {
                const response = await fetch(
                    "https://restcountries.com/v3.1/alpha/" + code.toLowerCase()
                );

                if (!response.ok) {
                    throw new Error("Country code not found.");
                }

                const data = await response.json();
                const country = data[0];

                const countryName = country.name.common;
                const capital = country.capital
                    ? country.capital[0]
                    : "Not available";

                const region = country.region || "Not available";

                result.innerHTML = `
                    <div class="success">
                        <strong>✓ Registration Successful!</strong><br>
                        Developer Name: <b>${name}</b><br>
                        Country: <b>${countryName}</b><br>
                        Capital: <b>${capital}</b><br>
                        Region: <b>${region}</b><br>
                        Number of Projects: <b>${travellers}</b>
                    </div>
                `;

            } catch (error) {
                result.innerHTML =
                    `<div class="error">Error: ${error.message} Please check the country code or internet connection.</div>`;
            }
        }
    </script>

</body>
</html>
